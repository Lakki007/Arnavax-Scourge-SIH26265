name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Verify prebuilt binaries
        run: cd bin && sha256sum -c SHA256SUMS
      - name: Unit tests (no server)
        run: python -m pytest -q tests/test_units.py tests/test_policy.py
      - name: Start the portal (verifier and synthetic banks start with it)
        run: |
          ./scripts/run.sh > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
      - name: Acceptance and browser tests (real prover and verifier, synthetic bank)
        run: python -m pytest -q tests/test_acceptance.py tests/test_ui_journey.py
      - name: App log on failure
        if: failure()
        run: tail -200 app.log
