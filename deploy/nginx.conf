# Scourge behind nginx (TLS). Replace server_name and certificate paths; the app stays on 127.0.0.1:8080.
server {
    listen 80;
    server_name scourge.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name scourge.example.org;
    ssl_certificate     /etc/letsencrypt/live/scourge.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scourge.example.org/privkey.pem;

    client_max_body_size 2304k;         # = the app limit (2 MB upload + 256 KB); nginx answers 413 itself
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /internal/ { return 404; }  # verifier -> app only, over loopback
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
