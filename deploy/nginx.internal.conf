# Internal listener for an independently deployed verifier (deploy/compose.two-host.yml).
# Only /internal/ and only from private networks; the shared X-Internal-Key is still checked by the app.
# Never published to the internet. No X-Forwarded-For: the app sees the request as local.
server {
  listen 8081;
  allow 10.0.0.0/8;
  allow 172.16.0.0/12;
  allow 192.168.0.0/16;
  allow 127.0.0.1;
  deny all;
  location /internal/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 120s;
  }
  location / { return 404; }
}
